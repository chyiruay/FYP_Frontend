plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Google Maps key: read from android/secrets.properties (gitignored), falling
// back to android/local.defaults.properties (committed placeholder).
def mapsSecrets = new Properties()
[rootProject.file("local.defaults.properties"), rootProject.file("secrets.properties")].each { f ->
    if (f.exists()) { f.withInputStream { mapsSecrets.load(it) } }
}

android {
    namespace = "com.example.water_alert_app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.water_alert_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += [MAPS_API_KEY:mapsSecrets.getProperty("MAPS_API_KEY", "DEFAULT_API_KEY")]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
