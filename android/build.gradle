buildscript {
    repositories {
        google()       // 必须添加，因为 Secrets 插件在 Google 仓库
        mavenCentral() // Maven 中央仓库
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.0"  // Android Gradle 插件（建议版本与项目匹配）
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"  // Kotlin 插件（如果使用 Kotlin）
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// 可选：自定义构建目录（谨慎使用）
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Old plugins (e.g. location 5.x pins compileSdk 33) fail AAR metadata checks
// against current AndroidX, which needs 34+. Raise them to the app's compileSdk.
// Must be registered before the evaluationDependsOn block below.
subprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin("com.android.library")) {
            def sdk = p.android.compileSdk
            if (sdk == null || sdk < 36) {
                p.android.compileSdk = 36
            }
        }
    }
}

// 按需依赖 :app 模块（如果存在）
subprojects {
    if (project.name != "app" && project.hasProperty("android")) {
        project.evaluationDependsOn(":app")
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
