buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.0"  // Android Gradle Plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"  // Kotlin Gradle Plugin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Put build output in the Flutter project's build/ folder
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Old plugins (e.g. location 5.x pins compileSdk 33) fail AAR metadata checks
// against current AndroidX, which needs 34+. Raise them to the app's compileSdk.
// Must be registered before the evaluationDependsOn block below.
subprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin("com.android.library")) {
            def sdk = p.android.compileSdk
            if (sdk == null || sdk < 36) {
                p.android.compileSdk = 36
            }
        }
    }
}

// Evaluate :app before plugin subprojects
subprojects {
    if (project.name != "app" && project.hasProperty("android")) {
        project.evaluationDependsOn(":app")
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
